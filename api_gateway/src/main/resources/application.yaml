server:
  port: 8282
eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka/
spring:
  application:
    name: api_gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/v1/orders/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/v1/products/**
            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/v3/api-docs/order
              filters:
                - RewritePath=/v3/api-docs/order, /v3/api-docs
            - id: product-service-docs
              uri: lb://product-service
              predicates:
                - Path=/v3/api-docs/product
              filters:
                - RewritePath=/v3/api-docs/product, /v3/api-docs
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/kien
          jwk-set-uri: http://localhost:8085/realms/kien/protocol/openid-connect/certs

logging:
  level:
    root: info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: order-service
        url: /v3/api-docs/order
      - name: product-service
        url: /v3/api-docs/product
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
